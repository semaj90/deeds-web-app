name: Parent Atlas check

on:
  pull_request:
    paths:
      - 'web-app/sveltekit-frontend/src/lib/server/atlas/**'
      - 'web-app/sveltekit-frontend/src/lib/server/db/atlas-*.ts'
      - 'web-app/sveltekit-frontend/src/routes/atlas/**'
      - 'web-app/sveltekit-frontend/src/routes/api/atlas/**'
      - 'web-app/sveltekit-frontend/drizzle.config.ts'
      - '.github/workflows/parent-atlas-check.yml'
  push:
    branches:
      - feature/parent-atlas-resolution-scaffold

jobs:
  svelte-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-app/sveltekit-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web-app/sveltekit-frontend/package-lock.json
      - run: npm ci
      - run: npm run check
